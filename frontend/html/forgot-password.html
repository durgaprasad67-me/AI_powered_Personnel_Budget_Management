<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A1F44">
  <title>Reset Password | FinSight AI</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../assets/icons/dashboard_icon.png">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Auth Stylesheet -->
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">

  <main class="auth-container">
    <div class="auth-card" role="region" aria-label="Password Reset Card">
      <div class="auth-brand">
        <div class="brand-badge" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
            <polyline points="16 7 22 7 22 13"></polyline>
          </svg>
        </div>
        <div class="brand-title">FinSight <span>AI</span></div>
        <div class="brand-tagline">Smarter Finance. Brighter Future.</div>
      </div>

      <div class="auth-header">
        <h1>Reset Password</h1>
        <p>Password recovery will be available shortly.</p>
      </div>

      <div class="alert-banner show alert-warning" style="margin-bottom: 24px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="12" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <span>Password reset service is undergoing scheduled maintenance. Please contact support or try logging in again.</span>
      </div>

      <a href="/login" class="submit-btn" style="text-decoration: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span class="btn-text">Back to Sign In</span>
      </a>
    </div>
  </main>

  <script src="../js/auth.js"></script>
</body>
</html>
