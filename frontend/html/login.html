<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A1F44">
  <title>Sign In | FinSight AI</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../assets/icons/dashboard_icon.png">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Auth Stylesheet -->
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">

  <main class="auth-container">
    <div class="auth-card" role="region" aria-label="Sign In Card">

      <!-- Brand Header -->
      <div class="auth-brand">
        <div class="brand-badge" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
            <polyline points="16 7 22 7 22 13"></polyline>
          </svg>
        </div>
        <div class="brand-title">FinSight <span>AI</span></div>
        <div class="brand-tagline">Smarter Finance. Brighter Future.</div>
      </div>

      <div class="auth-header">
        <h1>Welcome Back!</h1>
        <p>Sign in to your FinSight AI account</p>
      </div>

      <!-- Global Alert Banner -->
      <div id="alertBanner" class="alert-banner" role="alert" aria-live="polite">
        <svg id="alertIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="alertMessage"></span>
      </div>

      <!-- Login Form -->
      <form id="loginForm" autocomplete="on" novalidate>

        <!-- Identifier (Email or Username) -->
        <div class="form-group">
          <label for="identifier" class="visually-hidden">Email Address</label>
          <div class="input-wrapper" id="identifierWrapper">
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input
              type="text"
              id="identifier"
              name="identifier"
              class="form-input"
              placeholder="Email Address"
              autocomplete="username"
              required
              aria-required="true"
              aria-describedby="identifierError"
            >
          </div>
          <div id="identifierError" class="field-error" aria-live="polite"></div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password" class="visually-hidden">Password</label>
          <div class="input-wrapper" id="passwordWrapper">
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="Password"
              autocomplete="current-password"
              required
              aria-required="true"
              aria-describedby="passwordError capsWarning"
            >
            <button
              type="button"
              id="togglePasswordBtn"
              class="toggle-pwd-btn"
              aria-label="Show password"
              title="Toggle password visibility"
            >
              <svg id="togglePasswordIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <div id="capsWarning" class="caps-lock-warning" aria-live="polite">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path>
              <line x1="12" y1="9" x2="12" y2="13"></line>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
            <span>Caps Lock is ON</span>
          </div>
          <div id="passwordError" class="field-error" aria-live="polite"></div>
        </div>

        <!-- Form Options: Remember Me & Forgot Password -->
        <div class="form-options-row">
          <label class="remember-me-label" for="rememberMe">
            <input type="checkbox" id="rememberMe" name="remember_me" class="remember-me-checkbox">
            <span>Remember Me</span>
          </label>
          <a href="/forgot-password" class="forgot-pwd-link">Forgot Password?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="submit-btn">
          <span class="btn-text">Sign In</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>

        <!-- Divider -->
        <div class="auth-divider">
          <span>or</span>
        </div>

        <!-- Footer Switch Link -->
        <div class="auth-footer">
          Don't have an account? <a href="/register">Sign Up</a>
        </div>

      </form>
    </div>
  </main>

  <script src="../js/auth.js"></script>
</body>
</html>
