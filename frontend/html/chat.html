<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinSight AI | Finance Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/chat.css?v=1">
</head>
<body>
  <main class="chat-shell">
    <header class="chat-header">
      <a class="back-link" href="dashboard.html">← Dashboard</a>
      <div class="brand">
        <span class="brand-mark">✦</span>
        <div>
          <strong>FinSight AI</strong>
          <span>Personal finance assistant</span>
        </div>
      </div>
      <span class="status"><i></i> Ready to help</span>
    </header>

    <section class="chat-card">
      <div class="intro">
        <span class="intro-icon">✦</span>
        <div>
          <p class="eyebrow">Ask FinSight</p>
          <h1>Make smarter decisions with your money.</h1>
          <p class="intro-copy">Ask about your spending, budgets, or ways to improve your monthly cash flow.</p>
        </div>
      </div>

      <div class="suggestions" aria-label="Suggested questions">
        <button type="button" data-question="What are my main spending categories?">Where am I spending most?</button>
        <button type="button" data-question="How can I reduce my monthly expenses?">How can I reduce expenses?</button>
        <button type="button" data-question="Am I on track with my budgets?">Am I on track with my budgets?</button>
      </div>

      <div class="conversation" id="conversation" aria-live="polite">
        <div class="message assistant">
          <span class="message-avatar">✦</span>
          <div class="bubble">Hi! Ask me anything about your financial activity and I’ll use your FinSight data to help.</div>
        </div>
      </div>

      <form class="question-form" id="questionForm">
        <label for="question">Your question</label>
        <div class="input-row">
          <textarea id="question" name="question" rows="2" minlength="3" maxlength="1000" placeholder="e.g. What should I focus on this month?" required></textarea>
          <button class="send-button" type="submit" id="sendButton">Ask AI <span>→</span></button>
        </div>
        <div class="form-options">
          <label><input type="checkbox" id="recommendations" checked> Include recommendations</label>
          <span id="formStatus"></span>
        </div>
      </form>
    </section>
  </main>
  <script src="../js/chat.js?v=1" defer></script>
</body>
</html>
