<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FinSight AI | Budgets</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../assets/icons/dashboard_icon.png">
  <link rel="apple-touch-icon" href="../assets/icons/dashboard_icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css"><link rel="stylesheet" href="../css/budgets.css">
</head>
<body data-page="Budgets">
  <div class="app-shell"><aside class="sidebar" id="sidebar"></aside><main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" id="menuBtn" type="button" aria-label="Open navigation">
          <i data-lucide="menu"></i>
        </button>
        <div class="breadcrumb">Workspace <span>/</span> <strong id="crumb">Budgets</strong></div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="notifyBtn" type="button" aria-label="Notifications">
          <i data-lucide="bell"></i>
          <span class="notification-count" id="notificationCount" hidden>0</span>
        </button>
        <button class="profile-btn" id="profileBtn" type="button" aria-label="User profile">
          <span class="avatar" data-user-initial>D</span>
          <span data-user-name>Personal account</span>
          <i data-lucide="chevron-down"></i>
        </button>
      </div>
    </header>
    <div class="content"><div class="page-heading"><div><div class="eyebrow">Plan your spending</div><h1>Budgets</h1><p class="subtitle">Set limits and track progress by category.</p></div><button class="primary" id="addBudget">+ Create budget</button></div><section class="grid grid-3" id="budgetCards"><div class="loading">Loading budgets...</div></section></div>
  </main></div><div class="modal" id="budgetModal"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Create budget</h2><button class="close" id="closeBudget">×</button></div><form class="form-grid" id="budgetForm"><input type="hidden" id="budgetId"><div class="field"><label for="budgetType">Budget applies to</label><select id="budgetType"><option value="expense">Expenses</option><option value="investment">Investments</option><option value="loan_repaid">Loan repayments</option><option value="loan_given">Loans given</option><option value="all">All cash outflows</option></select></div><div class="field"><label for="budgetCategory">Category</label><select id="budgetCategory"></select><input id="budgetOtherCategory" type="text" minlength="2" maxlength="30" placeholder="Enter custom category" hidden></div><div class="field"><label for="budgetAmount">Amount (₹)</label><input id="budgetAmount" type="number" min=".01" max="100000000" step=".01" required></div><div class="field"><label for="budgetStart">Start date</label><input id="budgetStart" type="date" required></div><div class="field"><label for="budgetEnd">End date <span class="label-optional">(optional)</span></label><input id="budgetEnd" type="date"></div><div class="field full"><button class="primary" type="submit">Save budget</button></div></form></div></div><div class="budget-warning-modal" id="budgetWarningModal" hidden role="dialog" aria-modal="true" aria-labelledby="budgetWarningTitle"><div class="budget-warning-card"><div class="budget-warning-icon">!</div><h2 id="budgetWarningTitle">Budget plan needs adjustment</h2><p id="budgetWarningMessage"></p><button class="primary" id="closeBudgetWarning" type="button">Review budgets</button></div></div>  <div class="modal confirm-modal" id="deleteBudgetModal" role="dialog" aria-modal="true" aria-labelledby="deleteBudgetTitle" aria-describedby="deleteBudgetMessage">
    <div class="modal-card confirm-card">
      <div class="confirm-icon" aria-hidden="true">!</div>
      <h2 id="deleteBudgetTitle">Delete budget?</h2>
      <p id="deleteBudgetMessage"></p>
      <div class="confirm-budget-details" id="deleteBudgetDetails"></div>
      <div class="confirm-actions">
        <button class="secondary" id="cancelDeleteBudget" type="button">No, keep it</button>
        <button class="danger confirm-delete" id="confirmDeleteBudget" type="button">Yes, delete budget</button>
      </div>
    </div>
  </div>
  <div class="top-popup" id="topPopup" role="alert" aria-live="assertive" hidden>
    <div class="top-popup-content">
      <div class="top-popup-icon" id="topPopupIcon">⚠️</div>
      <div class="top-popup-body">
        <div class="top-popup-title" id="topPopupTitle"></div>
        <div class="top-popup-message" id="topPopupMessage"></div>
        <div class="top-popup-meta" id="topPopupMeta" hidden></div>
      </div>
      <button class="top-popup-close" id="topPopupClose" type="button" aria-label="Dismiss message">×</button>
    </div>
    <div class="top-popup-progress"><div class="top-popup-progress-bar" id="topPopupProgressBar"></div></div>
  </div>
  <div class="notification-modal" id="notificationModal" role="dialog" aria-modal="true"
    aria-labelledby="notificationTitle" hidden>
    <div class="notification-card">
      <div class="notification-head">
        <div>
          <div class="eyebrow">Budget alerts</div>
          <h2 id="notificationTitle">Notifications</h2>
        </div>
        <div class="notification-actions">
          <label class="select-all-notifications"><input id="selectAllNotifications" type="checkbox"> Select all</label>
          <button class="secondary" id="deleteSelectedNotifications" type="button">Delete selected</button>
          <button class="close" id="closeNotifications" type="button" aria-label="Close notifications">×</button>
        </div>
      </div>
      <div class="notification-list" id="notificationList"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="https://unpkg.com/lucide@latest"></script><script src="../js/app.js"></script><script src="../js/budgets-page.js"></script>
</body>
</html>
