<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FinSight AI | Budgets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css"><link rel="stylesheet" href="../css/budgets.css">
</head>
<body data-page="Budgets">
  <div class="app-shell"><aside class="sidebar" id="sidebar"></aside><main class="main">
    <header class="topbar"><div class="topbar-left"><button class="menu-btn" id="menuBtn">☰</button><div class="breadcrumb">Workspace / <strong>Budgets</strong></div></div><div class="top-actions"><span class="avatar">D</span></div></header>
    <div class="content"><div class="page-heading"><div><div class="eyebrow">Plan your spending</div><h1>Budgets</h1><p class="subtitle">Set limits and track progress by category.</p></div><button class="primary" id="addBudget">+ Create budget</button></div><section class="grid grid-3" id="budgetCards"><div class="loading">Loading budgets...</div></section></div>
  </main></div><div class="modal" id="budgetModal"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Create budget</h2><button class="close" id="closeBudget">×</button></div><form class="form-grid" id="budgetForm"><input type="hidden" id="budgetId"><div class="field"><label for="budgetName">Name</label><input id="budgetName" required maxlength="100"></div><div class="field"><label for="budgetCategory">Category</label><input id="budgetCategory" placeholder="Food"></div><div class="field"><label for="budgetAmount">Amount (₹)</label><input id="budgetAmount" type="number" min=".01" step=".01" required></div><div class="field"><label for="budgetPeriod">Period</label><select id="budgetPeriod"><option>monthly</option><option>weekly</option><option>quarterly</option><option>yearly</option><option>custom</option></select></div><div class="field"><label for="budgetStart">Start date</label><input id="budgetStart" type="date" required></div><div class="field"><label for="budgetEnd">End date (custom)</label><input id="budgetEnd" type="date"></div><div class="field full"><button class="primary" type="submit">Save budget</button></div></form></div></div><div class="toast" id="toast"></div>
  <script src="https://unpkg.com/lucide@latest"></script><script src="../js/app.js"></script><script src="../js/budgets-page.js"></script>
</body>
</html>
