<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FinSight AI | Budgets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css"><link rel="stylesheet" href="../css/budgets.css">
</head>
<body data-page="Budgets">
  <div class="app-shell"><aside class="sidebar" id="sidebar"></aside><main class="main">
    <header class="topbar"><div class="topbar-left"><button class="menu-btn" id="menuBtn">☰</button><div class="breadcrumb">Workspace / <strong>Budgets</strong></div></div><div class="top-actions"><span class="avatar">D</span></div></header>
    <div class="content"><div class="page-heading"><div><div class="eyebrow">Plan your spending</div><h1>Budgets</h1><p class="subtitle">Set limits and track progress by category.</p></div><button class="primary" id="addBudget">+ Create budget</button></div><section class="grid grid-3" id="budgetCards"><div class="loading">Loading budgets...</div></section></div>
  </main></div><div class="modal" id="budgetModal"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Create budget</h2><button class="close" id="closeBudget">×</button></div><form class="form-grid" id="budgetForm"><input type="hidden" id="budgetId"><div class="field"><label for="budgetCategory">Category</label><select id="budgetCategory"></select></div><div class="field"><label for="budgetType">Budget applies to</label><select id="budgetType"><option value="expense">Expenses</option><option value="income">Income</option><option value="investment">Investments</option><option value="investment_return">Investment returns</option><option value="loan_taken">Loan returns received</option><option value="loan_repaid">Loan repayments</option><option value="loan_given">Loans given</option><option value="loan_collected">Loan returns collected</option><option value="all">All transaction types</option></select></div><div class="field"><label for="budgetAmount">Amount (₹)</label><input id="budgetAmount" type="number" min=".01" max="100000000" step=".01" required></div><div class="field"><label for="budgetStart">Start date</label><input id="budgetStart" type="date" required></div><div class="field"><label for="budgetEnd">End date <span class="label-optional">(optional)</span></label><input id="budgetEnd" type="date"></div><div class="field full"><button class="primary" type="submit">Save budget</button></div></form></div></div><div class="budget-warning-modal" id="budgetWarningModal" hidden role="dialog" aria-modal="true" aria-labelledby="budgetWarningTitle"><div class="budget-warning-card"><div class="budget-warning-icon">!</div><h2 id="budgetWarningTitle">Budget plan needs adjustment</h2><p id="budgetWarningMessage"></p><button class="primary" id="closeBudgetWarning" type="button">Review budgets</button></div></div><div class="toast" id="toast"></div>
  <script src="https://unpkg.com/lucide@latest"></script><script src="../js/app.js"></script><script src="../js/budgets-page.js"></script>
</body>
</html>
