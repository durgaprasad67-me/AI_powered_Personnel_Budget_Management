<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinSight AI | Goals</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../assets/icons/dashboard_icon.png">
  <link rel="apple-touch-icon" href="../assets/icons/dashboard_icon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/goals.css">
</head>
<body data-page="Financial goals">

  <div class="app-shell">
    
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>
    
    <!-- Main Content -->
    <main class="main">
      
      <!-- Top Navigation -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-btn" id="menuBtn" type="button" aria-label="Open navigation">
            <i data-lucide="menu"></i>
          </button>
          <div class="breadcrumb">
            Workspace <span>/</span> <strong id="crumb">Financial goals</strong>
          </div>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="notifyBtn" type="button" aria-label="Notifications">
            <i data-lucide="bell"></i>
            <span class="notification-count" id="notificationCount" hidden>0</span>
          </button>
          <button class="profile-btn" id="profileBtn" type="button" aria-label="User profile">
            <span class="avatar" data-user-initial>D</span>
            <span data-user-name>Personal account</span>
            <i data-lucide="chevron-down"></i>
          </button>
        </div>
      </header>
      
      <!-- Page Content -->
      <div class="content">
        
        <!-- Page Header -->
        <div class="page-heading">
          <div>
            <div class="eyebrow">Build your future</div>
            <h1>Financial goals</h1>
            <p class="subtitle">Track the goals that matter most to you.</p>
          </div>
          <button class="primary" id="addGoal">+ Add goal</button>
        </div>
        
        <!-- Goals Grid -->
        <section class="grid grid-2" id="goalCards">
          <div class="loading">Loading goals...</div>
        </section>

      </div>
    </main>
  </div>

  <!-- Add Goal Modal -->
  <div class="modal" id="goalModal">
    <div class="modal-card">
      
      <!-- Modal Header -->
      <div class="modal-head">
        <h2>Add financial goal</h2>
        <button class="close" id="closeGoal">×</button>
      </div>
      
      <!-- Modal Form -->
      <form class="form-grid" id="goalForm">
        <input type="hidden" id="goalId">
        
        <div class="field">
          <label for="goalName">Name</label>
          <input id="goalName" required maxlength="100">
        </div>
        
        <div class="field">
          <label for="goalTarget">Target amount (₹)</label>
          <input id="goalTarget" type="number" min=".01" step=".01" required>
        </div>
        
        <div class="field">
          <label for="goalCurrent">Current amount (₹)</label>
          <input id="goalCurrent" type="number" min="0" step=".01" value="0">
        </div>
        
        <div class="field">
          <label for="goalDate">Target date</label>
          <input id="goalDate" type="date">
        </div>
        
        <div class="field full">
          <label for="goalDescription">Description</label>
          <textarea id="goalDescription" rows="3"></textarea>
        </div>
        
        <div class="field full">
          <button class="primary" type="submit">Save goal</button>
        </div>
      </form>

    </div>
  </div>

  <!-- Delete Goal Confirmation Modal -->
  <div class="modal confirm-modal" id="deleteGoalModal" role="dialog" aria-modal="true" aria-labelledby="deleteGoalTitle" aria-describedby="deleteGoalMessage">
    <div class="modal-card confirm-card">
      <div class="confirm-icon" aria-hidden="true">!</div>
      <h2 id="deleteGoalTitle">Delete financial goal?</h2>
      <p id="deleteGoalMessage"></p>
      <div class="confirm-goal-details" id="deleteGoalDetails"></div>
      <div class="confirm-actions">
        <button class="secondary" id="cancelDeleteGoal" type="button">No, keep it</button>
        <button class="danger confirm-delete" id="confirmDeleteGoal" type="button">Yes, delete goal</button>
      </div>
    </div>
  </div>

  <!-- Top Popup Alert & Issue Message -->
  <div class="top-popup" id="topPopup" role="alert" aria-live="assertive" hidden>
    <div class="top-popup-content">
      <div class="top-popup-icon" id="topPopupIcon">⚠️</div>
      <div class="top-popup-body">
        <div class="top-popup-title" id="topPopupTitle"></div>
        <div class="top-popup-message" id="topPopupMessage"></div>
        <div class="top-popup-meta" id="topPopupMeta" hidden></div>
      </div>
      <button class="top-popup-close" id="topPopupClose" type="button" aria-label="Dismiss message">×</button>
    </div>
    <div class="top-popup-progress"><div class="top-popup-progress-bar" id="topPopupProgressBar"></div></div>
  </div>

  <!-- Toast Notification System -->
  <div class="toast" id="toast"></div>

  <!-- Scripts -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../js/app.js"></script>
  <script src="../js/goals-page.js"></script>
  
</body>
</html>
