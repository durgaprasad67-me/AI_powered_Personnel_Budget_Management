<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FinSight AI | Goals</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/app.css"><link rel="stylesheet" href="../css/goals.css"></head>
<body data-page="Financial goals"><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><main class="main"><header class="topbar"><div class="topbar-left"><button class="menu-btn" id="menuBtn">☰</button><div class="breadcrumb">Workspace / <strong>Financial goals</strong></div></div><span class="avatar">D</span></header><div class="content"><div class="page-heading"><div><div class="eyebrow">Build your future</div><h1>Financial goals</h1><p class="subtitle">Track the goals that matter most to you.</p></div><button class="primary" id="addGoal">+ Add goal</button></div><section class="grid grid-2" id="goalCards"><div class="loading">Loading goals...</div></section></div></main></div><div class="modal" id="goalModal"><div class="modal-card"><div class="modal-head"><h2>Add financial goal</h2><button class="close" id="closeGoal">×</button></div><form class="form-grid" id="goalForm"><input type="hidden" id="goalId"><div class="field"><label>Name</label><input id="goalName" required maxlength="100"></div><div class="field"><label>Target amount (₹)</label><input id="goalTarget" type="number" min=".01" step=".01" required></div><div class="field"><label>Current amount (₹)</label><input id="goalCurrent" type="number" min="0" step=".01" value="0"></div><div class="field"><label>Target date</label><input id="goalDate" type="date"></div><div class="field full"><label>Description</label><textarea id="goalDescription" rows="3"></textarea></div><div class="field full"><button class="primary">Save goal</button></div></form></div></div><div class="toast" id="toast"></div><script src="https://unpkg.com/lucide@latest"></script><script src="../js/app.js"></script><script src="../js/goals-page.js"></script></body></html>
